name: Build
on:
  pull_request:
  push:
    branches: [ main, local, test/gha ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    -
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit
    -
      name: Check out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    -
      name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        cache: true
        check-latest: true
        go-version-file: 'go.mod'
    -
      name: Downnlaod Go modules
      run: go mod download -json
    -
      name: Install golint
      run: go install golang.org/x/lint/golint@latest
    -
      name: Check formatting
      run: gofmt -d -e -l -s .
    -
      name: Lint
      run: golint -set_exit_status ./...
    -
      name: Build and test
      run: |
        go test -v ./...
        go build ./cmd/walker
        go build ./cmd/reporter

  checks:
    name: Static Checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    -
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit
    -
      name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    -
      name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        cache: true
        check-latest: true
        go-version-file: 'go.mod'
    -
      id: govulncheck
      name: govulncheck
      uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
      with:
        cache: false
        #go-version-file: 'go.mod'
        # An explicit Go version is needed for govulncheck-action since internally
        # it uses an outdated setup-go@v5.0 action that does not respect the 'toolchain'
        # directive in the 'go.mod' file.
        go-version-input: '1.25.8'
        repo-checkout: false
    -
      name: Build
      run: go build ./...
    -
      name: staticcheck
      uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
      continue-on-error: true
      with:
        version: "2025.1.1"
        install-go: false
        use-cache: false
    -
      name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.6.1
        # Use a long invalidation interval, the go.mod hash is more likely to
        # change more frequently and force a cache invalidation anyway.
        cache-invalidation-interval: 60
        #skip-cache: true
        #skip-save-cache: true
