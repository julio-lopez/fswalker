name: Build
on:
  pull_request:
  push:
    branches: [ main, local, test/gha ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    -
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit
    -
      name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    -
      id: setup_go
      name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        cache: true
        check-latest: true
        go-version-file: 'go.mod'
    -
      name: Downnlaod Go modules
      run: go mod download -json
    -
      name: Install golint
      run: go install golang.org/x/lint/golint@latest
    -
      name: Lint
      run: golint -set_exit_status ./...
    -
      name: Check formatting
      if: ${{ !cancelled() && steps.setup_go.conclusion == 'success' }}
      run: gofmt -d -e -l -s .
    -
      name: Build and test
      if: ${{ !cancelled() && steps.setup_go.conclusion == 'success' }}
      run: |
        go test -v ./...
        go build ./cmd/walker
        go build ./cmd/reporter

  checks:
    name: Static Checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    -
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit
    -
      name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    -
      id: setup_go
      name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        cache: true
        check-latest: true
        go-version-file: 'go.mod'
    -
      name: Build
      run: |
        go build ./...
        go test -list  '.*' ./...
    -
      name: golangci-lint
      if: ${{ !cancelled() && steps.setup_go.conclusion == 'success' }}
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
        # Use a long invalidation interval, the go.mod hash is more likely to
        # change more frequently and force a cache invalidation anyway.
        cache-invalidation-interval: 60
        #skip-cache: true
        #skip-save-cache: true
    -
      if: ${{ !cancelled() && steps.setup_go.conclusion == 'success' }}
      name: staticcheck
      uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
      continue-on-error: true
      with:
        version: "2026.2.2"
        install-go: false
        use-cache: false
